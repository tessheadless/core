[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Tess Dev Team"]
homepage = "https://tessheadless.com"
documentation = "https://tessheadless.com/docs/"
# Hybrid Community/Enterprise license, see LICENSE.md.
license-file = "LICENSE.md"

# Keep debug builds small: full debug info only for our crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
