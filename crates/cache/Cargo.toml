[package]
name = "tess-cache"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Tess response cache (Valkey or in-memory), invalidated by content changes and shared between instances."

[dependencies]
async-trait = "0.1.92"
futures-util = "0.3.34"
hex = "0.4.3"
redis = { version = "1.7.1", default-features = false, features = ["connection-manager", "tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
sha2 = "0.11.1"
tess-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.53.3", features = ["rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
serde_json = "1.0.154"
tess-core = { path = "../core", features = ["testkit"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
