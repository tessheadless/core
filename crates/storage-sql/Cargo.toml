[package]
name = "tess-storage-sql"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Tess storage backend for PostgreSQL, MySQL and SQLite (SeaQuery)."

[dependencies]
async-trait = "0.1.92"
tess-core = { version = "0.1.1", path = "../core" }
sea-query = { version = "1.0.2", features = ["with-json", "backend-postgres", "backend-mysql", "backend-sqlite"] }
sea-query-sqlx = { version = "0.9.1", features = ["with-json", "sqlx-postgres", "sqlx-mysql", "sqlx-sqlite"] }
serde = "1.0.229"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "json"] }
uuid = "1.28.0"

[dev-dependencies]
tess-core = { path = "../core", features = ["testkit"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
