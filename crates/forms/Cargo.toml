[package]
name = "tess-forms"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Tess forms: custom form definitions, public submissions and form.submitted events for webhooks and n8n."

[dependencies]
chrono = "0.4.45"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tess-core = { version = "0.1.1", path = "../core" }
tokio = { version = "1.53.3", features = ["sync"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
tess-core = { path = "../core", features = ["testkit"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
