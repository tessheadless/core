[package]
name = "tess-webhooks"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Tess outgoing webhooks: signed event deliveries with retries (n8n, Zapier, custom services)."

[dependencies]
async-trait = "0.1.92"
hex = "0.4.3"
hmac = "0.13.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tess-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.53.3", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
