[package]
name = "tess-storage-mongodb"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Tess storage backend for MongoDB."

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
tess-core = { version = "0.1.0", path = "../core" }
futures = "0.3.34"
mongodb = "3.9.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = "1.28.0"

[dev-dependencies]
tess-core = { path = "../core", features = ["testkit"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
