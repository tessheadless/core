[package]
name = "tess-i18n"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Tess translations (Tolgee-like): keys, languages, review states, import/export in many formats, delivery to S3, R2, Garage and Azure Blob."

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
hex = "0.4.3"
hmac = "0.13.0"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tess-core = { version = "0.2.0", path = "../core" }
tess-media = { version = "0.2.0", path = "../media", default-features = false }
tokio = { version = "1.53.3", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }

[features]
default = ["s3"]
s3 = ["tess-media/s3"]
