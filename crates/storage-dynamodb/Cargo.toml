[package]
name = "tess-storage-dynamodb"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Tess storage backend for DynamoDB."

[dependencies]
async-trait = "0.1.92"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.130.0"
tess-core = { version = "0.1.1", path = "../core" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["time"] }
uuid = "1.28.0"

[dev-dependencies]
tess-core = { path = "../core", features = ["testkit"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
