[package]
name = "tess-storage-rocksdb"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Tess storage backend for RocksDB."

[dependencies]
async-trait = "0.1.92"
tess-core = { version = "0.2.0", path = "../core" }
rocksdb = "0.25.0"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt"] }
uuid = "1.28.0"

[dev-dependencies]
tess-core = { path = "../core", features = ["testkit"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
