[package]
name = "tess-search"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Tess full-text search (Typesense)."

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
tess-core = { version = "0.1.1", path = "../core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["sync"] }
tracing = "0.1.44"
uuid = "1.28.0"

[dev-dependencies]
tess-core = { path = "../core", features = ["testkit"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
