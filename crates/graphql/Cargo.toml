[package]
name = "tess-graphql"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Tess GraphQL API, generated at runtime from content models."

[dependencies]
async-graphql = { version = "7.2.1", features = ["dynamic-schema", "chrono"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
tess-auth = { version = "0.2.0", path = "../auth" }
tess-core = { version = "0.2.0", path = "../core" }
tess-i18n = { version = "0.2.0", path = "../i18n", default-features = false }
tess-media = { version = "0.2.0", path = "../media", default-features = false }
tess-plugins = { version = "0.2.0", path = "../plugins" }
tess-search = { version = "0.2.0", path = "../search" }
tess-forms = { version = "0.2.0", path = "../forms" }
tess-webhooks = { version = "0.2.0", path = "../webhooks" }
getrandom = "0.4.3"
hmac = "0.13.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "time"] }
tracing = "0.1.44"
uuid = "1.28.0"

[dev-dependencies]
axum = "0.8.9"
tess-i18n = { path = "../i18n", default-features = false }
tess-webhooks = { path = "../webhooks" }
bytes = "1.12.1"
tess-auth = { path = "../auth" }
tess-core = { path = "../core" }
tess-media = { path = "../media", default-features = false }
tess-search = { path = "../search" }
getrandom = "0.4.3"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
uuid = "1.28.0"
