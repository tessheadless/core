[package]
name = "tess-media"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Tess media library: S3-compatible and filesystem blob stores."

[dependencies]
async-trait = "0.1.92"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1.152.0", optional = true }
bytes = "1.12.1"
tess-core = { version = "0.1.0", path = "../core" }
getrandom = "0.4.3"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["fs", "io-util"] }
tracing = "0.1.44"
uuid = "1.28.0"

[dev-dependencies]
tess-core = { path = "../core", features = ["testkit"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }

[features]
default = ["s3"]
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
