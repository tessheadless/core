# Tess alone, for local use: embedded RocksDB database and uploaded files on
# disk, both in the `tess-local-data` volume. No database server, no S3, no
# Typesense.
#
#   cp .env.example .env    # fill TESS_ID_SECRET, TESS_REF_SECRET,
#                           # TESS_SESSION_SECRET and TESS_ADMIN_TOKEN
#                           # (one `openssl rand -hex 32` each)
#   docker compose -f docker-compose-local.yml up --build
#
# With a release bundle (no sources), the published image is pulled instead:
# see INSTALL.md.
#
# Then open http://localhost:8080/admin/ and create the first Owner with
# TESS_ADMIN_TOKEN. Data survives restarts; `down -v` deletes it.
name: tess-local

services:
  tess:
    build: .
    image: ${TESS_IMAGE:-ghcr.io/tessheadless/tess}:${TESS_VERSION:-latest}${TESS_ARCH:+-${TESS_ARCH}}
    ports:
      - 8080:8080
    environment:
      # Storage: embedded, single instance.
      TESS_DATABASE: rocksdb
      ROCKSDB_PATH: /data/rocksdb
      TESS_MEDIA_STORE: fs
      TESS_MEDIA_DIR: /data/media
      # No search engine (`memory` works too, but its index is lost on restart).
      TESS_SEARCH: none
      TESS_LOG_FORMAT: text
      # Secrets come from `.env` (never commit it).
      TESS_ID_SECRET: ${TESS_ID_SECRET:?set TESS_ID_SECRET in .env (openssl rand -hex 32)}
      TESS_REF_SECRET: ${TESS_REF_SECRET:?set TESS_REF_SECRET in .env (openssl rand -hex 32)}
      TESS_SESSION_SECRET: ${TESS_SESSION_SECRET:?set TESS_SESSION_SECRET in .env (openssl rand -hex 32)}
      # Bootstrap token, only needed to create the first Owner; then empty it.
      TESS_ADMIN_TOKEN: ${TESS_ADMIN_TOKEN:-}
      TESS_MCP: ${TESS_MCP}
      TESS_MCP_URL: ${TESS_MCP_URL:-/mcp}
      TESS_MCP_TOKEN: ${TESS_MCP_TOKEN:-}
      TESS_MCP_ALLOWED_HOSTS: ${TESS_MCP_ALLOWED_HOSTS}
      # Encrypts stored webhook and storage credentials (falls back to
      # TESS_SESSION_SECRET when empty).
      TESS_SECRETS_KEY: ${TESS_SECRETS_KEY:-}
      # Workflows: set TESS_N8N_URL=http://n8n:5678 with the `n8n` profile.
      TESS_N8N_URL: ${TESS_N8N_URL:-}
    volumes:
      - tess-local-data:/data
    restart: unless-stopped

  # Workflow automation (optional), embedded in the admin UI at
  # /admin/workflows and proxied by Tess under /n8n/:
  #   docker compose -f docker-compose-local.yml --profile n8n up -d
  # with TESS_N8N_URL=http://n8n:5678 and N8N_ENCRYPTION_KEY in `.env` (without
  # a key, n8n generates one and keeps it in its volume).
  n8n:
    profiles: [n8n]
    build:
      context: .
      dockerfile: deploy/n8n/Dockerfile
    image: ${TESS_N8N_IMAGE:-ghcr.io/tessheadless/tess-n8n}:${TESS_VERSION:-latest}${TESS_ARCH:+-${TESS_ARCH}}
    environment:
      # Tess serves n8n under /n8n/ (prefix stripped); n8n generates URLs with it.
      N8N_PATH: /n8n/
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://localhost:8080/n8n/}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:8080/n8n/}
      N8N_PROXY_HOPS: 1
      # Server-sent events go through the Tess proxy (WebSockets do not).
      N8N_PUSH_BACKEND: sse
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      # Plain HTTP on localhost; set `true` behind HTTPS.
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
    volumes:
      - n8n-local-data:/home/node/.n8n
    restart: unless-stopped

volumes:
  tess-local-data:
  n8n-local-data:
