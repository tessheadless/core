[package]
name = "tess-client-example"
version = "0.1.0"
edition = "2024"
authors = ["Tess Dev Team"]
homepage = "https://tessheadless.com"
documentation = "https://tessheadless.app/doc/"
description = "Example Rust client for the Tess GraphQL API."
license-file = "../../../LICENSE.md"
publish = false

# Standalone crate: an empty workspace table keeps it out of the CMS workspace.
[workspace]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
