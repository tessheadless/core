[package]
name = "webhook-plugin"
version = "1.0.0"
edition = "2024"
authors = ["Tess Dev Team"]
homepage = "https://tessheadless.com"
documentation = "https://tessheadless.com/docs/"
description = "Example Tess plugin: webhook notifications."
license-file = "../../../LICENSE.md"
publish = false

# Standalone: not part of the CMS workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
